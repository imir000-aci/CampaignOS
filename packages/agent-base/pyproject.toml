[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-base"
version = "0.1.0"
description = "Base framework for CampaignOS AI agents — LLM client, tool registry, validation loops, cost guard, telemetry"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.6.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
run-agent = "agent_base.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_base"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
