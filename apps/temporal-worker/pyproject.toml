[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-worker"
version = "0.1.0"
description = "CampaignOS Temporal workflow worker — campaign lifecycle orchestration"
requires-python = ">=3.11"
dependencies = [
    "agent-base",
    "supervisor-agent",
    "temporalio>=1.7.0",
    "pydantic>=2.6.0",
    "psycopg[binary]>=3.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -v"
