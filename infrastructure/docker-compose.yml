name: campaignos

# ─── Shared config ──────────────────────────────────────────────────────────────
x-postgres-common: &postgres-common
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: campaignos
    POSTGRES_PASSWORD: campaignos
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U campaignos"]
    interval: 5s
    timeout: 5s
    retries: 10
  networks:
    - campaignos-net

x-postgres-pgvector: &postgres-pgvector
  image: pgvector/pgvector:pg16
  restart: unless-stopped
  environment:
    POSTGRES_USER: campaignos
    POSTGRES_PASSWORD: campaignos
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U campaignos"]
    interval: 5s
    timeout: 5s
    retries: 10
  networks:
    - campaignos-net

services:

  # ─── Postgres (one per domain service) ────────────────────────────────────────

  postgres-strategy:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: strategy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-strategy-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-audience:
    <<: *postgres-pgvector
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: audience_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-audience-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-targeting:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: targeting_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-targeting-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-experience:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: experience_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-experience-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-experiment:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: experiment_db
    ports:
      - "5436:5432"
    volumes:
      - postgres-experiment-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-measurement:
    <<: *postgres-pgvector
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: measurement_db
    ports:
      - "5437:5432"
    volumes:
      - postgres-measurement-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-recommendation:
    <<: *postgres-pgvector
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: recommendation_db
    ports:
      - "5438:5432"
    volumes:
      - postgres-recommendation-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-offer:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: offer_db
    ports:
      - "5439:5432"
    volumes:
      - postgres-offer-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-bundle:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: bundle_db
    ports:
      - "5440:5432"
    volumes:
      - postgres-bundle-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M

  postgres-creative:
    <<: *postgres-pgvector
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: creative_db
    ports:
      - "5441:5432"
    volumes:
      - postgres-creative-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-semantic:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: semantic_db
    ports:
      - "5442:5432"
    volumes:
      - postgres-semantic-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M

  postgres-activation:
    <<: *postgres-common
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: activation_db
    ports:
      - "5443:5432"
    volumes:
      - postgres-activation-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-temporal:
    <<: *postgres-common
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal_db
    ports:
      - "5444:5432"
    volumes:
      - postgres-temporal-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Neo4j ────────────────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/campaignos_neo4j"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - campaignos-net

  # ─── Redpanda (Kafka-compatible) ───────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - campaignos-net

  redpanda-console:
    image: redpandadata/console:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./redpanda/console-config.yml:/tmp/config.yml:ro
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campaignos-net

  # ─── MinIO ─────────────────────────────────────────────────────────────────────

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: campaignos_minio
      MINIO_ROOT_PASSWORD: campaignos_minio_secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - campaignos-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 campaignos_minio campaignos_minio_secret;
        mc mb --ignore-existing local/campaignos-creative-assets;
        mc mb --ignore-existing local/campaignos-recommendation-models;
        mc mb --ignore-existing local/campaignos-audience-exports;
        mc mb --ignore-existing local/campaignos-activation-exports;
        mc mb --ignore-existing local/campaignos-measurement-exports;
        mc mb --ignore-existing local/campaignos-imports;
        mc mb --ignore-existing local/campaignos-temporal-payloads;
        echo 'MinIO buckets initialized';
      "
    networks:
      - campaignos-net

  # ─── Redis ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass campaignos_redis --maxmemory 200mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "campaignos_redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campaignos-net

  # ─── Temporal ──────────────────────────────────────────────────────────────────

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres-temporal
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamic_config.yaml
    volumes:
      - ./temporal/dynamic_config.yaml:/etc/temporal/dynamic_config.yaml:ro
    depends_on:
      postgres-temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 15s
      timeout: 10s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - campaignos-net

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    ports:
      - "8233:8233"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      temporal:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - campaignos-net

  # ─── OpenTelemetry Collector ───────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (self)
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - prometheus
      - jaeger
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campaignos-net

  # ─── Prometheus ────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campaignos-net

  # ─── Grafana ───────────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: campaignos_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campaignos-net

  # ─── Jaeger ────────────────────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campaignos-net

# ─── Networks ───────────────────────────────────────────────────────────────────

networks:
  campaignos-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────────

volumes:
  postgres-strategy-data:
  postgres-audience-data:
  postgres-targeting-data:
  postgres-experience-data:
  postgres-experiment-data:
  postgres-measurement-data:
  postgres-recommendation-data:
  postgres-offer-data:
  postgres-bundle-data:
  postgres-creative-data:
  postgres-semantic-data:
  postgres-activation-data:
  postgres-temporal-data:
  neo4j-data:
  neo4j-logs:
  redpanda-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
